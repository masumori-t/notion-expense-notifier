name: 小口精算 未清算チェック

# 毎日 9:25 と 15:15 (Asia/Tokyo) に加え、業務時間帯は30分ごとに実行する。
# GitHub Actions の schedule は数分〜数十分遅延することがあるため、
# 取りこぼし防止として頻度を上げている。
# cron はUTC基準(JST = UTC+9)。
# 手動実行(workflow_dispatch)も可能(Actionsタブから "Run workflow" で実行できる)。
on:
  schedule:
    - cron: "25 0 * * *" # 09:25 JST (指定時刻)
    - cron: "15 6 * * *" # 15:15 JST (指定時刻)
    # 09:00-18:30 JST (= 00:00-09:30 UTC) は30分ごと
    - cron: "0,30 0-9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると、Notionへの書き込み(タスク作成・状態ファイル更新)を行わずログ確認のみ行う"
        type: boolean
        default: false

# 前回の実行が終わる前に次の実行が始まって状態ファイルの更新が競合しないよう、
# 同時実行を1つに制限する(キャンセルはせず、順番に実行させる)。
concurrency:
  group: notion-expense-notify
  cancel-in-progress: false

permissions:
  contents: write # 状態ファイル(state/last-checked.json)をコミットするために必要

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          persist-credentials: true # 後段の git push で GITHUB_TOKEN を使うため

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Notionをチェックし、必要ならタスクを作成
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_TASK_DATA_SOURCE_ID: ${{ secrets.NOTION_TASK_DATA_SOURCE_ID }}
          NOTION_ASSIGNEE_USER_ID: ${{ secrets.NOTION_ASSIGNEE_USER_ID }}
          # schedule実行時は inputs が空になるため、明示的に false にする
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node src/notify.js

      - name: 状態ファイルの更新をコミット
        # dry-run実行時や、未通知データが無くタスクを作成しなかった場合は
        # state/last-checked.json を書き換えていないため、通常「変更なし」でスキップされる。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- state/last-checked.json)" ]; then
            echo "状態ファイルに変更なし。コミットをスキップします。"
          else
            git add state/last-checked.json
            git commit -m "chore: 前回チェック時刻を更新 [skip ci]"
            git push
          fi
