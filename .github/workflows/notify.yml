name: 小口精算 未清算チェック

# 毎日 9:25 / 13:00 / 15:15 (Asia/Tokyo) に自動実行する。
# cron はUTC基準(JST = UTC+9)。
#
# 重要: GitHub無料プランの Private リポジトリでは schedule が動かない/不安定なことがある。
# その場合はリポジトリを Public にするか、外部cronから workflow_dispatch を呼ぶこと(README参照)。
# 手動実行(workflow_dispatch)は Actions タブからいつでも可能。
on:
  schedule:
    - cron: "25 0 * * *" # 09:25 JST
    - cron: "0 4 * * *" # 13:00 JST
    - cron: "15 6 * * *" # 15:15 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると、Notionへの書き込み(タスク作成・状態ファイル更新)を行わずログ確認のみ行う"
        type: boolean
        default: false

# 前回の実行が終わる前に次の実行が始まって状態ファイルの更新が競合しないよう、
# 同時実行を1つに制限する(キャンセルはせず、順番に実行させる)。
concurrency:
  group: notion-expense-notify
  cancel-in-progress: false

permissions:
  contents: write # 状態ファイル(state/last-checked.json)をコミットするために必要
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Notionをチェックし、必要ならタスクを作成
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_TASK_DATA_SOURCE_ID: ${{ secrets.NOTION_TASK_DATA_SOURCE_ID }}
          NOTION_ASSIGNEE_USER_ID: ${{ secrets.NOTION_ASSIGNEE_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          # 診断用: schedule / workflow_dispatch のどちらで起動したかログに出す
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          echo "[notify] trigger=${TRIGGER_EVENT}"
          node src/notify.js

      - name: 最終実行時刻を必ず記録する
        # タスクを作らなかった日でも「定期実行が動いたか」を残す。
        # Private無料枠で schedule が死んでいる場合、このコミットが増えないことで気づける。
        if: success()
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-runのため状態ファイルは更新しません。"
            exit 0
          fi
          node <<'EOF'
          const fs = require("fs");
          const path = "state/last-checked.json";
          let state = { lastCheckedAt: null, notifiedPageIds: [], lastRunAt: null };
          try {
            state = { ...state, ...JSON.parse(fs.readFileSync(path, "utf8")) };
          } catch (_) {}
          state.lastRunAt = new Date().toISOString();
          fs.mkdirSync("state", { recursive: true });
          fs.writeFileSync(path, JSON.stringify(state, null, 2) + "\n");
          console.log("[notify] lastRunAt を更新:", state.lastRunAt);
          EOF

      - name: 状態ファイルの更新をコミット
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- state/last-checked.json)" ]; then
            echo "状態ファイルに変更なし。コミットをスキップします。"
          else
            git add state/last-checked.json
            git commit -m "chore: 実行状態を更新 [skip ci]"
            git push
          fi
